<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Grab preview</title>
    <script>
      // Dev harness: stubs just enough of the extension APIs to render the popup
      // in a plain browser tab. Not referenced by the manifest. See README.
      const THEME = new URLSearchParams(location.search).get('theme') || 'dark';
      const ITEMS = [
        { id: '1', url: 'https://cdn.example.com/assets/keynote-final-cut.mp4', kind: 'file', name: 'keynote-final-cut', mime: 'video/mp4', size: 148000000, height: 1080, duration: 754, origin: 'cdn.example.com' },
        { id: '2', url: 'https://stream.example.tv/live/master.m3u8', kind: 'hls', name: 'Live session — opening night', mime: 'application/x-mpegURL', size: 0, origin: 'stream.example.tv' },
        { id: '3', url: 'https://video.example.net/dash/documentary-ep04.mpd', kind: 'dash', name: 'documentary-ep04', mime: 'application/dash+xml', size: 0, height: 720, origin: 'video.example.net' },
        { id: '4', url: 'https://scontent.example.com/v/reel_2f9a1c.mp4', kind: 'file', name: 'reel_2f9a1c', mime: 'video/mp4', size: 8400000, height: 640, duration: 31, origin: 'scontent.example.com' },
        { id: '5', url: 'https://audio.example.org/eps/episode-212-audio.m4a', kind: 'audio', name: 'episode-212-audio', mime: 'audio/mp4', size: 32000000, duration: 2130, origin: 'audio.example.org' },
      ];
      window.chrome = {
        storage: { local: { get: async () => ({ theme: THEME }), set: async () => {} } },
        tabs: { query: async () => [{ id: 1 }], sendMessage: async () => ({ ok: true }) },
        scripting: { executeScript: async () => {} },
        runtime: {
          onMessage: { addListener: () => {} },
          sendMessage: async (m) =>
            m.type === 'list'
              ? { items: ITEMS }
              : m.type === 'variants'
                ? { variants: [{ id: 'a', label: '1080p · 5400 kbps' }, { id: 'b', label: '720p · 2800 kbps' }] }
                : {},
        },
      };
    </script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img class="mark mark-light" src="../../icons/mark-light.png" alt="" width="17" height="17" />
        <img class="mark mark-dark" src="../../icons/mark-dark.png" alt="" width="17" height="17" />
        <h1>Grab</h1>
        <span class="count" id="count" hidden></span>
      </div>
      <div class="tools">
        <button class="icon" id="rescan" aria-label="Scan again">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" />
          </svg>
        </button>
        <button class="icon" id="theme" aria-label="Switch theme">
          <svg viewBox="0 0 16 16" class="sun" aria-hidden="true">
            <circle cx="8" cy="8" r="3.1" />
            <path d="M8 .8v1.9M8 13.3v1.9M.8 8h1.9M13.3 8h1.9M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4" />
          </svg>
          <svg viewBox="0 0 16 16" class="moon" aria-hidden="true">
            <path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.8 5.8 0 1 0 7 7Z" />
          </svg>
        </button>
      </div>
    </header>

    <main id="list" class="list" tabindex="-1">
      <div class="empty" id="empty">
        <span class="pulse" aria-hidden="true"></span>
        <p class="empty-title">Nothing detected yet</p>
        <p class="empty-note">Start playing the video, then reopen this panel.</p>
      </div>
    </main>

    <footer class="dock">
      <div class="ambient" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
      </div>

      <label class="quality" id="quality-wrap" hidden>
        <span class="quality-label">Quality</span>
        <select id="quality"></select>
      </label>
      <div class="note" id="note" hidden></div>
      <button class="glass" id="download" disabled>
        <span class="glass-fill" id="fill"></span>
        <span class="glass-sheen" aria-hidden="true"></span>
        <span class="glass-label" id="download-label">Select a file</span>
      </button>
    </footer>

    <script src="popup.js"></script>
    <script>
      // Land on a selected stream so the quality row and glass button show.
      addEventListener('load', () =>
        setTimeout(() => {
          document.querySelectorAll('.item')[1]?.click();
          if (new URLSearchParams(location.search).get('state') === 'busy') {
            setTimeout(() => {
              setButton('Downloading  62%', { busy: true, percent: 62 });
              setNote('148 / 240 segments');
            }, 60);
          }
        }, 120)
      );
    </script>
  </body>
</html>
