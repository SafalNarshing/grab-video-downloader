<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Grab preview</title>
    <script>
      // Dev harness: stubs the extension APIs and the local server so the popup
      // renders in a plain browser tab. Not referenced by the manifest.
      //   ?theme=dark|light  ?state=playing|empty|busy|offline
      const Q = new URLSearchParams(location.search);
      const THEME = Q.get('theme') || 'dark';
      const MODE = Q.get('state') || 'playing';
      const SERVER_UP = MODE !== 'offline';

      const POSTER =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">
             <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
               <stop offset="0" stop-color="#1b2a6b"/><stop offset="0.55" stop-color="#5a2a8f"/>
               <stop offset="1" stop-color="#0d5f63"/></linearGradient></defs>
             <rect width="640" height="360" fill="url(#g)"/>
             <circle cx="470" cy="96" r="120" fill="#ffffff" opacity="0.10"/>
             <circle cx="150" cy="300" r="150" fill="#000000" opacity="0.18"/>
             <path d="M282 140l86 40-86 40z" fill="#ffffff" opacity="0.9"/>
           </svg>`
        );

      const INFO = {
        title: 'Big Buck Bunny 60fps 4K — Official Blender Foundation Short Film',
        thumbnail: POSTER,
        duration: 635,
        uploader: 'Blender',
        extractor: 'Youtube',
        webpage_url: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ',
        is_live: false,
        options: [
          { key: 'best', label: 'Best available', detail: 'MP4', type: 'mp4', height: 0 },
          { key: 'h2160', label: '2160p', detail: 'MP4 · 689 MB', type: 'mp4', height: 2160 },
          { key: 'h1080', label: '1080p', detail: 'MP4 · 128 MB', type: 'mp4', height: 1080 },
          { key: 'h720', label: '720p', detail: 'MP4 · 78 MB', type: 'mp4', height: 720 },
          { key: 'mp3', label: 'Audio only', detail: 'MP3 · 192 kbps', type: 'mp3', height: 0 },
        ],
      };

      const LOCAL_QUALITIES = [
        { key: 'a', itemId: 'a', label: '720p', detail: '78 MB', height: 720 },
        { key: 'b', itemId: 'b', label: '360p', detail: '24 MB', height: 360 },
      ];

      // Stand in for the local server.
      window.fetch = async (url) => {
        const path = String(url);
        if (!SERVER_UP) throw new TypeError('Failed to fetch');
        const body = path.includes('/health')
          ? { status: 'ok', app: 'Grab', version: '1.1.0', yt_dlp: '2026.08.19', ffmpeg: true }
          : INFO;
        return { ok: true, status: 200, text: async () => JSON.stringify(body) };
      };

      window.chrome = {
        storage: {
          local: {
            get: async (k) => (k === 'theme' ? { theme: THEME } : { apiBase: 'http://127.0.0.1:8787' }),
            set: async () => {},
          },
        },
        tabs: {
          query: async () => [{ id: 1, url: INFO.webpage_url, title: INFO.title }],
          sendMessage: async () => ({ ok: true }),
        },
        scripting: { executeScript: async () => {} },
        runtime: {
          openOptionsPage: () => {},
          onMessage: { addListener: () => {} },
          sendMessage: async (m) => {
            if (m.type !== 'state') return {};
            return {
              server: SERVER_UP
                ? { ok: true, base: 'http://127.0.0.1:8787', ffmpeg: true }
                : { ok: false, base: 'http://127.0.0.1:8787', error: 'refused' },
              pendingUrl: null,
              job: null,
              playing:
                MODE === 'empty'
                  ? null
                  : {
                      hasVideo: true,
                      title: INFO.title,
                      poster: POSTER,
                      site: 'youtube.com',
                      duration: 635,
                      height: 1080,
                      live: false,
                    },
              qualities: MODE === 'empty' ? [] : LOCAL_QUALITIES,
            };
          },
        },
      };
    </script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img class="mark mark-light" src="../../icons/mark-light.png" alt="" width="17" height="17" />
        <img class="mark mark-dark" src="../../icons/mark-dark.png" alt="" width="17" height="17" />
        <h1>Grab</h1>
      </div>
      <div class="tools">
        <button class="icon" id="rescan" aria-label="Scan again">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" />
          </svg>
        </button>
        <button class="icon" id="popout" title="Open in a window that stays put" aria-label="Open in a window">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M9.5 2.5H13.5V6.5" />
            <path d="M13.5 2.5 8 8" />
            <path d="M12.5 9.8v3.7H2.5V3.5h3.7" />
          </svg>
        </button>
        <button class="icon" id="api-toggle" aria-label="Server address" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="4.5" />
            <rect x="2" y="9" width="12" height="4.5" />
            <path d="M4.4 4.75h.01M4.4 11.25h.01" />
          </svg>
          <span class="dot" id="server-dot" data-state="unknown"></span>
        </button>
        <button class="icon" id="theme" aria-label="Switch theme">
          <svg viewBox="0 0 16 16" class="sun" aria-hidden="true">
            <circle cx="8" cy="8" r="3.1" />
            <path d="M8 .8v1.9M8 13.3v1.9M.8 8h1.9M13.3 8h1.9M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4" />
          </svg>
          <svg viewBox="0 0 16 16" class="moon" aria-hidden="true">
            <path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.8 5.8 0 1 0 7 7Z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="apibar" id="apibar" hidden>
      <input
        class="apibar-input"
        id="api-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="http://127.0.0.1:8787"
        aria-label="Server address"
      />
      <button class="apibar-btn" id="api-save" type="button">Save</button>
      <button class="apibar-btn" id="api-more" type="button">More</button>
    </section>

    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <span class="pulse" aria-hidden="true"></span>
        <p class="empty-title">Nothing playing</p>
        <p class="empty-note">Press play on the video, then reopen this panel — or paste a link below.</p>
      </div>

      <article class="hero" id="hero" hidden>
        <div class="thumb" id="thumb">
          <img class="thumb-img" id="thumb-img" alt="" hidden />
          <span class="thumb-blank" id="thumb-blank" aria-hidden="true"></span>
          <span class="chip chip-time" id="chip-time" hidden></span>
          <span class="chip chip-live" id="chip-live" hidden>LIVE</span>
        </div>
        <h2 class="title" id="title"></h2>
        <p class="sub" id="sub"></p>
      </article>
    </main>

    <footer class="dock">
      <div class="ambient" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
      </div>

      <form class="link" id="link-form">
        <input
          class="link-input"
          id="link-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Paste a video or page link"
          aria-label="Paste a video or page link"
        />
        <button class="link-go" id="link-go" type="submit" aria-label="Fetch this link">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" />
          </svg>
        </button>
      </form>

      <label class="quality" id="quality-wrap" hidden>
        <span class="quality-label">Quality</span>
        <select id="quality"></select>
      </label>

      <div class="note" id="note" hidden></div>

      <button class="glass" id="download" disabled>
        <span class="glass-fill" id="fill"></span>
        <span class="glass-sheen" aria-hidden="true"></span>
        <span class="glass-label" id="download-label">Nothing to download</span>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
    <script type="module">
      if (MODE === 'busy') {
        setTimeout(() => {
          document.getElementById('download-label').textContent = 'Downloading  62%';
          document.getElementById('fill').style.width = '62%';
          document.getElementById('download').classList.add('busy');
          const note = document.getElementById('note');
          note.textContent = '4.20MiB/s · ETA 00:38';
          note.hidden = false;
        }, 400);
      }
      if (MODE === 'apibar') setTimeout(() => (document.getElementById('apibar').hidden = false), 300);
    </script>
    <script type="module">
      // Dev aid: ?measure=1 stamps layout widths onto <html> so a headless
      // --dump-dom run can read them.
      if (Q.get('measure')) {
        setTimeout(() => {
          const w = (el) => (el ? Math.round(el.getBoundingClientRect().width) : -1);
          document.documentElement.setAttribute(
            'data-measure',
            JSON.stringify({
              vw: innerWidth,
              html: w(document.documentElement),
              body: w(document.body),
              surface: document.documentElement.dataset.surface || 'popup',
              bar: w(document.querySelector('.bar')),
              stage: w(document.querySelector('.stage')),
              thumb: w(document.querySelector('.thumb')),
              dock: w(document.querySelector('.dock')),
              scrollW: document.documentElement.scrollWidth,
            })
          );
        }, 900);
      }
    </script>
  </body>
</html>
